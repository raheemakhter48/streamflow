name: Deploy Frontend to Oracle Cloud

on:
  push:
    branches:
      - main
    paths:
      - 'web/**'
      - '.github/workflows/deploy-frontend.yml'
  workflow_dispatch:

concurrency:
  group: streamflow-frontend-oracle
  cancel-in-progress: true

jobs:
  build-frontend:
    name: 📦 Build Frontend (Vite)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: 📦 Install Web Dependencies
        working-directory: ./web
        run: npm ci || npm install

      - name: 🔨 Build Production Assets
        working-directory: ./web
        run: npm run build

      - name: 💾 Save Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: web/dist
          retention-days: 1

  deploy-to-oracle:
    name: 🚀 Deploy to Oracle VPS & Reload Nginx
    needs: [build-frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 📥 Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: dist

      - name: 🔑 Setup SSH Connection
        env:
          SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.ORACLE_HOST }} >> ~/.ssh/known_hosts

      - name: 📤 Upload Build Archive to VPS
        run: |
          echo "📦 Compressing build files..."
          tar -czf dist.tar.gz -C dist .
          echo "🚀 Transferring to Oracle VPS..."
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no dist.tar.gz ${{ secrets.ORACLE_USER }}@${{ secrets.ORACLE_HOST }}:/tmp/dist.tar.gz

      - name: 🌐 Publish to /var/www/streamhub & Reload Nginx
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no ${{ secrets.ORACLE_USER }}@${{ secrets.ORACLE_HOST }} "
            set -e
            echo '📂 Extracting build files to /var/www/streamhub...'
            sudo mkdir -p /var/www/streamhub
            sudo tar -xzf /tmp/dist.tar.gz -C /var/www/streamhub/
            rm -f /tmp/dist.tar.gz
            echo '🔄 Reloading Nginx...'
            sudo systemctl reload nginx
            echo '✅ Deployment complete!'
          "

      - name: 🩺 Verify Live Site
        run: |
          echo "🌐 Testing live website status..."
          curl -I --fail https://streamhubflow.qzz.io
