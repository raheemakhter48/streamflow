name: Deploy Backend to Oracle Cloud

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'Dockerfile'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

concurrency:
  group: streamflow-oracle-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Setup SSH key
        env:
          SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.ORACLE_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to Oracle
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no ${{ secrets.ORACLE_USER }}@${{ secrets.ORACLE_HOST }} "bash -c '
            set -e
            export NVM_DIR=\"\$HOME/.nvm\"
            [ -s \"\$NVM_DIR/nvm.sh\" ] && . \"\$NVM_DIR/nvm.sh\"
            NODE_BIN=\$(find \$HOME/.nvm/versions/node -maxdepth 2 -type d -name bin 2>/dev/null | tail -n 1)
            export PATH=\"\$PATH:\$NODE_BIN:/usr/local/bin:/usr/bin\"
            
            cd ~/streamflow
            git fetch origin main
            git reset --hard origin/main
            cd backend
            sudo docker compose down 2>/dev/null || true
            
            if pm2 describe streamflow-backend >/dev/null 2>&1; then
              pm2 restart streamflow-backend --update-env
            elif pm2 describe streamflow-api >/dev/null 2>&1; then
              pm2 restart streamflow-api --update-env
            else
              pm2 start server.js --name streamflow-backend --update-env
            fi
            pm2 save
            
            for i in {1..15}; do
              if curl --silent --fail http://127.0.0.1:7860/health; then
                echo "Backend is online and healthy!"
                break
              fi
              echo "Waiting for backend on port 7860..."
              sleep 2
            done
            curl --fail --silent --show-error http://127.0.0.1:7860/health
          '"
